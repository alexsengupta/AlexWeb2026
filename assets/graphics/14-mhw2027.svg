<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 80 80">
  <!-- MHW2027 / IMHWS-1 nav icon: warm sun over a heated ocean -->
  <defs>
    <style>
      .m0 { fill: #df7926; }
      .m1 { fill: none; stroke: #486072; stroke-width: 3.6px; }
      .m2 { fill: none; stroke: #ef5252; stroke-width: 2.6px; stroke-linecap: round; }
      .m3 { fill: none; stroke: #ef5252; stroke-width: 3.4px; stroke-linecap: round; }
      .m4 { fill: none; stroke: #3d6b7f; stroke-width: 3.4px; stroke-linecap: round; }
      .m5 { fill: #87b5c4; opacity: .35; }
    </style>
    <clipPath id="mhwDisc">
      <circle cx="40" cy="40" r="36"/>
    </clipPath>
  </defs>

  <!-- ocean tint in the lower half of the disc -->
  <g clip-path="url(#mhwDisc)">
    <rect class="m5" x="0" y="44" width="80" height="36"/>
  </g>

  <!-- sun -->
  <circle class="m0" cx="40" cy="31" r="10"/>
  <g>
    <line class="m2" x1="27.4" y1="27.6" x2="22.6" y2="26.3"/>
    <line class="m2" x1="31.3" y1="21.3" x2="28.0" y2="17.6"/>
    <line class="m2" x1="40.0" y1="18.0" x2="40.0" y2="13.0"/>
    <line class="m2" x1="48.7" y1="21.3" x2="52.0" y2="17.6"/>
    <line class="m2" x1="52.6" y1="27.6" x2="57.4" y2="26.3"/>
  </g>

  <!-- waves: warm above, cool below -->
  <g clip-path="url(#mhwDisc)">
    <path class="m3" d="M2,52 q8,-6.5 16,0 t16,0 t16,0 t16,0 t16,0"/>
    <path class="m4" d="M2,64 q8,-6.5 16,0 t16,0 t16,0 t16,0 t16,0"/>
  </g>

  <!-- outer ring -->
  <circle class="m1" cx="40" cy="40" r="36"/>
</svg>
