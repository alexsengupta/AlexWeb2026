<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Research Group | Alex Sen Gupta</title>
<meta name="description" content="Postdocs, PhD, Honours and visiting students in Alex Sen Gupta's ocean and climate research group at UNSW Sydney, and where alumni are now.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6f9; --surface: #ffffff; --ink: #132030; --ink-2: #45556a; --muted: #758398; --line: rgba(19, 32, 48, 0.1);
    --accent: #1767c8;
    --t-mhw: #e8552f; --t-polar: #2f8fe0; --t-climate: #8a62e0; --t-circulation: #13a08f; --t-life: #e09a17;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  a { color: var(--accent); }

  header { max-width: 1240px; margin: 0 auto; padding: 18px 24px 8px; }
  .home { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); text-decoration: none; }
  .home:hover { color: var(--ink); border-color: var(--ink-2); }
  h1 { margin: 22px 0 6px; font-size: clamp(30px, 4.4vw, 48px); font-weight: 600; letter-spacing: -0.3px; }
  .lede { margin: 0; max-width: 860px; font-size: 17px; line-height: 1.55; color: var(--ink-2); }

  main { max-width: 1240px; margin: 0 auto; padding: 8px 24px 64px; }
  section { margin-top: 34px; }
  .sec-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .sec-head h2 { margin: 0; font-size: 24px; font-weight: 600; }
  .sec-head span { color: var(--muted); font-size: 15px; }

  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); perspective: 1200px; }
  .grid.alumni { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }

  /* ---------- Tiles ---------- */
  .tile { position: relative; display: block; width: 100%; padding: 0; border: 0; text-align: left; cursor: pointer; background: var(--surface); border-radius: 18px; overflow: hidden;
          box-shadow: 0 1px 2px rgba(19,32,48,0.06), 0 6px 18px rgba(19,32,48,0.06);
          transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0px));
          transition: transform 0.35s cubic-bezier(.2,.8,.2,1), box-shadow 0.35s; transform-style: preserve-3d; will-change: transform; }
  .tile:hover, .tile:focus-visible { --lift: -6px; box-shadow: 0 2px 4px rgba(19,32,48,0.08), 0 22px 40px -8px rgba(19,32,48,0.28); }
  .tile:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }
  .pic { position: relative; aspect-ratio: 4 / 4.4; overflow: hidden; background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--c) 10%, #fff), color-mix(in srgb, var(--c) 26%, #fff)); }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.6s cubic-bezier(.2,.8,.2,1), filter 0.4s; }
  .pic .ini { position: absolute; inset: 0; display: grid; place-items: center; color: color-mix(in srgb, var(--c) 85%, #0b1b2c); font-size: 54px; font-weight: 600; letter-spacing: 1px; transition: transform 0.6s cubic-bezier(.2,.8,.2,1); }
  .alumni .pic .ini { font-size: 44px; }
  .tile:hover .pic img, .tile:focus-visible .pic img { transform: scale(1.08); filter: saturate(1.1); }
  .tile:hover .pic .ini, .tile:focus-visible .pic .ini { transform: scale(1.12); }
  /* light sheen that follows the pointer */
  .pic::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.3s;
                background: radial-gradient(circle at var(--mx, 50%) var(--my, 30%), rgba(255,255,255,0.35), transparent 55%); }
  .tile:hover .pic::after { opacity: 1; }
  /* the reveal panel that slides up over the photo */
  .reveal { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 14px 12px; color: #fff; font-size: 13.5px; line-height: 1.4;
            background: linear-gradient(to top, rgba(8, 18, 30, 0.92) 0%, rgba(8, 18, 30, 0.78) 60%, transparent 100%);
            transform: translateY(101%); transition: transform 0.4s cubic-bezier(.2,.8,.2,1); }
  .reveal b { display: block; font-weight: 600; font-size: 14px; margin-bottom: 3px; }
  .reveal .now { display: block; margin-top: 6px; color: #cfe0f2; }
  .reveal .go { display: inline-block; margin-top: 8px; font-size: 12.5px; color: #fff; opacity: 0.85; border-bottom: 1px solid rgba(255,255,255,0.5); }
  .tile:hover .reveal, .tile:focus-visible .reveal { transform: translateY(0); }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); transform: scaleX(0); transform-origin: left; transition: transform 0.45s cubic-bezier(.2,.8,.2,1); z-index: 2; }
  .tile:hover .bar, .tile:focus-visible .bar { transform: scaleX(1); }
  .info { padding: 12px 14px 14px; }
  .name { font-size: 16.5px; font-weight: 600; line-height: 1.25; }
  .alumni .name { font-size: 15.5px; }
  .role { font-size: 13.5px; color: var(--ink-2); margin-top: 3px; }
  .award-dot { display: inline-block; margin-left: 4px; color: #c88a00; }

  .empty { color: var(--muted); padding: 24px 0; }

  /* ---------- Detail dialog ---------- */
  dialog { border: 0; padding: 0; border-radius: 20px; width: min(620px, calc(100vw - 28px)); max-height: calc(100dvh - 40px); box-shadow: 0 30px 80px rgba(0,0,0,0.35); }
  dialog[open] { animation: pop 0.28s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }
  dialog::backdrop { background: rgba(10, 20, 32, 0.55); backdrop-filter: blur(3px); }
  .d-top { display: flex; gap: 18px; align-items: center; padding: 22px 22px 16px; border-top: 6px solid var(--c); }
  .d-face { flex: none; width: 96px; height: 96px; border-radius: 50%; overflow: hidden; background: linear-gradient(145deg, var(--c), color-mix(in srgb, var(--c) 55%, #0b1b2c)); display: grid; place-items: center; color: #fff; font-size: 32px; font-weight: 600; }
  .d-face img { width: 100%; height: 100%; object-fit: cover; }
  .d-top h3 { margin: 0; font-size: 23px; font-weight: 600; line-height: 1.2; }
  .d-role { color: var(--ink-2); font-size: 15px; margin-top: 3px; }
  .d-area { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13.5px; color: var(--ink-2); }
  .d-area i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .d-body { padding: 0 22px 22px; font-size: 15.5px; line-height: 1.6; color: var(--ink-2); }
  .d-body .t { color: var(--ink); font-weight: 600; font-size: 16px; line-height: 1.4; margin: 0 0 8px; }
  .d-body p { margin: 0 0 12px; }
  .d-earlier { border-top: 1px dashed var(--line); padding-top: 10px; font-size: 14.5px; }
  .d-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 14px; font-size: 14.5px; }
  .d-meta b { color: var(--ink); }
  .award { background: #fff2cc; color: #6f4b00; border-radius: 999px; padding: 3px 10px; font-size: 13px; }
  .d-meta a { font-weight: 500; text-decoration: none; }
  .x { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: #eef2f6; cursor: pointer; font-size: 21px; line-height: 1; }
  .x:hover { background: #e2e8ef; }

  @media (max-width: 640px) {
    header, main { padding-left: 14px; padding-right: 14px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .grid.alumni { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .pic .ini { font-size: 40px; }
    .name { font-size: 15px; } .role { font-size: 12.5px; }
    .reveal { display: none; }
    .d-top { padding: 18px 18px 14px; gap: 14px; } .d-face { width: 72px; height: 72px; font-size: 24px; }
    .d-body { padding: 0 18px 18px; }
  }
  @media (hover: none) { .reveal { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    .tile, .pic img, .pic .ini, .reveal, .bar { transition: none; }
    dialog[open] { animation: none; }
  }
</style>
</head>
<body>
<header>
  <a class="home" href="../index.html" aria-label="Back to home">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
  </a>
  <h1>Research Group</h1>
</header>

<main>
  <section aria-labelledby="hCurrent">
    <div class="sec-head"><h2 id="hCurrent">Current members</h2><span id="nCurrent"></span></div>
    <div class="grid current" id="gCurrent"></div>
  </section>
  <section aria-labelledby="hAlumni">
    <div class="sec-head"><h2 id="hAlumni">Alumni</h2><span id="nAlumni"></span></div>
    <div class="grid alumni" id="gAlumni"></div>
  </section>
</main>

<dialog id="dlg" aria-labelledby="dName">
  <button class="x" id="dlgClose" aria-label="Close">&times;</button>
  <div id="dlgBody"></div>
</dialog>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var TYPE = {
    postdoc: { cur: 'Postdoc', alum: 'Postdoc', order: 0 },
    visiting: { cur: 'Visiting PhD student', alum: 'Visiting PhD student', order: 1 },
    phd: { cur: 'PhD student', alum: 'PhD', order: 2 },
    masters: { cur: 'Masters student', alum: 'Masters', order: 3 },
    honours: { cur: 'Honours student', alum: 'Honours', order: 4 },
    intern: { cur: 'Research Intern', alum: 'Research Intern', order: 5 }
  };
  var people = [], themeName = {};

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function initials(name) { var p = name.replace(/^Dr\.?\s+/, '').split(/\s+/); return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
  function roleText(p) {
    var t = TYPE[p.type], yrs = (p.years || '').replace(/^(PhD|Honours|Masters)\s+/, '');
    return (p.status === 'current' ? t.cur : t.alum) + (yrs ? ' · ' + yrs : '');
  }
  function endYear(p) { var m = (p.years || '').match(/(\d{4})(?!.*\d{4})/); return m ? +m[1] : 0; }
  function color(p) { return 'var(--t-' + p.theme + ')'; }

  fetch('research_group.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(init)
    .catch(function (e) { console.error(e); $('gCurrent').innerHTML = '<div class="empty">Sorry, the group list could not be loaded.</div>'; });

  function init(d) {
    (d.themes || []).forEach(function (t) { themeName[t.id] = t.name; });
    people = Object.keys(d.members).map(function (k) { var p = d.members[k]; p.id = k; return p; });
    var cur = people.filter(function (p) { return p.status === 'current'; })
      .sort(function (a, b) { return TYPE[a.type].order - TYPE[b.type].order || a.name.replace(/^Dr /, '').localeCompare(b.name.replace(/^Dr /, '')); });
    var alum = people.filter(function (p) { return p.status !== 'current'; })
      .sort(function (a, b) { return endYear(b) - endYear(a) || TYPE[a.type].order - TYPE[b.type].order || a.name.localeCompare(b.name); });
    render('gCurrent', cur); render('gAlumni', alum);
    $('nCurrent').textContent = cur.length + ' people';
    $('nAlumni').textContent = alum.length + ' people';
  }

  function tileHTML(p) {
    var face = p.photo ? '<img src="' + esc(p.photo) + '" alt="" loading="lazy">' : '<div class="ini" aria-hidden="true">' + esc(initials(p.name)) + '</div>';
    var reveal = '<b>' + esc(p.title || p.area) + '</b>' + (p.status !== 'current' && p.now ? '<span class="now">Now: ' + esc(p.now) + '</span>' : '') + '<span class="go">More about ' + esc(p.name.replace(/^Dr\.?\s+/, '').split(' ')[0]) + '</span>';
    return '<button class="tile" data-id="' + p.id + '" style="--c:' + color(p) + '" aria-label="' + esc(p.name + ', ' + roleText(p)) + '">' +
      '<span class="bar"></span><div class="pic">' + face + '<div class="reveal">' + reveal + '</div></div>' +
      '<div class="info"><div class="name">' + esc(p.name) + (p.awards ? '<span class="award-dot" title="' + esc(p.awards) + '">★</span>' : '') + '</div>' +
      '<div class="role">' + esc(roleText(p)) + '</div></div></button>';
  }

  function render(id, list) {
    var g = $(id);
    g.innerHTML = list.map(tileHTML).join('');
    g.querySelectorAll('.tile').forEach(function (t) {
      var p = people.filter(function (x) { return x.id === t.dataset.id; })[0];
      t.addEventListener('click', function () { open(p); });
      // gentle 3D tilt and a sheen that follow the pointer
      t.addEventListener('pointermove', function (e) {
        if (e.pointerType !== 'mouse' || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        t.style.setProperty('--ry', ((x - 0.5) * 10).toFixed(2) + 'deg');
        t.style.setProperty('--rx', ((0.5 - y) * 8).toFixed(2) + 'deg');
        t.style.setProperty('--mx', (x * 100).toFixed(1) + '%'); t.style.setProperty('--my', (y * 100).toFixed(1) + '%');
      });
      t.addEventListener('pointerleave', function () { t.style.removeProperty('--rx'); t.style.removeProperty('--ry'); });
    });
  }

  var dlg = $('dlg');
  function open(p) {
    var face = p.photo ? '<img src="' + esc(p.photo) + '" alt="">' : esc(initials(p.name));
    var h = '<div class="d-top" style="--c:' + color(p) + '"><div class="d-face">' + face + '</div><div>' +
      '<h3 id="dName">' + esc(p.name) + '</h3><div class="d-role">' + esc(roleText(p)) + '</div>' +
      '<div class="d-area"><i></i>' + esc(themeName[p.theme] || '') + '</div></div></div><div class="d-body">';
    if (p.title) h += '<p class="t">' + esc(p.title) + '</p>';
    h += '<p>' + esc(p.research) + '</p>';
    (p.earlier || []).forEach(function (e) { h += '<p class="d-earlier"><b>Earlier: ' + esc(e.role) + (e.years ? ' ' + esc(e.years) : '') + '.</b> ' + esc(e.research) + '</p>'; });
    var meta = '';
    if (p.status !== 'current' && p.now) meta += '<span>Now: <b>' + esc(p.now) + '</b></span>';
    if (p.note) meta += '<span>' + esc(p.note) + '</span>';
    if (p.awards) meta += '<span class="award">★ ' + esc(p.awards) + '</span>';
    if (p.web) meta += '<a href="' + esc(p.web) + '" target="_blank" rel="noopener">Profile ↗</a>';
    if (meta) h += '<div class="d-meta">' + meta + '</div>';
    $('dlgBody').innerHTML = h + '</div>';
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }
  $('dlgClose').addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
})();
</script>
</body>
</html>
