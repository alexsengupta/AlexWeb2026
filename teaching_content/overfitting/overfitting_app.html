<script>
"use strict";
var h=React.createElement,F=React.Fragment,useState=React.useState,useMemo=React.useMemo,useEffect=React.useEffect,useRef=React.useRef;

// ============================================================
// MATH
// ============================================================
function mulberry32(seed){var s=seed|0;return function(){s=(s+0x6D2B79F5)|0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function normalRng(rng){var spare=null;return function(){if(spare!==null){var v=spare;spare=null;return v}var u,v,s;do{u=2*rng()-1;v=2*rng()-1;s=u*u+v*v}while(s>=1||s===0);var f=Math.sqrt(-2*Math.log(s)/s);spare=v*f;return u*f}}
function ar1(phi,n,sigma,normal){var p=Math.max(-0.999,Math.min(0.999,phi));var isd=sigma*Math.sqrt(Math.max(1e-12,1-p*p));var x=new Array(n);x[0]=normal()*sigma;for(var t=1;t<n;t++)x[t]=p*x[t-1]+normal()*isd;return x}
function corrcoef(a,b){var n=a.length;if(n<3)return NaN;var ma=0,mb=0;for(var i=0;i<n;i++){ma+=a[i];mb+=b[i]}ma/=n;mb/=n;var sab=0,sa2=0,sb2=0;for(var i=0;i<n;i++){var da=a[i]-ma,db=b[i]-mb;sab+=da*db;sa2+=da*da;sb2+=db*db}if(sa2<1e-15||sb2<1e-15)return NaN;return sab/Math.sqrt(sa2*sb2)}
function r2score(obs,pred){var n=obs.length;if(n<2)return NaN;var m=0;for(var i=0;i<n;i++)m+=obs[i];m/=n;var sse=0,sst=0;for(var i=0;i<n;i++){sse+=(obs[i]-pred[i])**2;sst+=(obs[i]-m)**2}if(sst<1e-15)return NaN;return 1-sse/sst}
function rmse(obs,pred){var n=obs.length;if(!n)return NaN;var s=0;for(var i=0;i<n;i++)s+=(obs[i]-pred[i])**2;return Math.sqrt(s/n)}
function solveSymmetric(A,b){var n=A.length;var aug=A.map(function(row,i){return row.map(function(v,j){return v+(i===j?1e-10:0)}).concat(b[i])});for(var c=0;c<n;c++){var mr=c;for(var r=c+1;r<n;r++)if(Math.abs(aug[r][c])>Math.abs(aug[mr][c]))mr=r;var tmp=aug[c];aug[c]=aug[mr];aug[mr]=tmp;if(Math.abs(aug[c][c])<1e-15)continue;for(var r=c+1;r<n;r++){var f=aug[r][c]/aug[c][c];for(var j=c;j<=n;j++)aug[r][j]-=f*aug[c][j]}}var x=new Array(n).fill(0);for(var i=n-1;i>=0;i--){x[i]=aug[i][n];for(var j=i+1;j<n;j++)x[i]-=aug[i][j]*x[j];x[i]/=(aug[i][i]||1e-15)}return x}
function olsFit(X,y){var n=X.length,p=X[0].length;var XtX=Array.from({length:p},function(){return new Array(p).fill(0)});for(var i=0;i<n;i++)for(var j=0;j<p;j++)for(var k=0;k<p;k++)XtX[j][k]+=X[i][j]*X[i][k];var Xty=new Array(p).fill(0);for(var i=0;i<n;i++)for(var j=0;j<p;j++)Xty[j]+=X[i][j]*y[i];return solveSymmetric(XtX,Xty)}
function fitTrend(t,y){var n=t.length;if(n<2)return[0,0];var mt=0,my=0;for(var i=0;i<n;i++){mt+=t[i];my+=y[i]}mt/=n;my/=n;var num=0,den=0;for(var i=0;i<n;i++){num+=(t[i]-mt)*(y[i]-my);den+=(t[i]-mt)**2}var sl=den>1e-15?num/den:0;return[my-sl*mt,sl]}

// ============================================================
// SIMULATION
// ============================================================
function simulate(seed,params){var rng=mulberry32(seed);var normal=normalRng(rng);var years=Array.from({length:params.nYears},function(_,i){return params.startYear+i});var t=Array.from({length:params.nYears},function(_,i){return i});var y=ar1(params.phiY,params.nYears,params.sigmaY,normal);for(var i=0;i<params.nYears;i++)y[i]+=params.trendY*t[i];var X=Array.from({length:params.nPredictors},function(){var col=ar1(params.phiX,params.nYears,params.sigmaX,normal);if(Math.abs(params.trendX)>0)for(var i=0;i<params.nYears;i++)col[i]+=params.trendX*t[i];return col});return{years:years,t:t,y:y,X:X}}

function fitAndScore(seed,params,mp){var data=simulate(seed,params);var years=data.years,t=data.t,y=data.y,X=data.X;var n=params.nYears,p=params.nPredictors;var nTrain=Math.max(5,Math.min(mp.nTrain,n-5));
var trainMask;if(mp.splitMethod==="Random"){var rng2=mulberry32(seed+10000019);var idx=Array.from({length:n},function(_,i){return i});for(var i=n-1;i>0;i--){var j=Math.floor(rng2()*(i+1));var tmp=idx[i];idx[i]=idx[j];idx[j]=tmp}trainMask=new Array(n).fill(false);for(var i=0;i<nTrain;i++)trainMask[idx[i]]=true}else{trainMask=Array.from({length:n},function(_,i){return i<nTrain})}
var yW=y.slice(),XW=X.map(function(c){return c.slice()}),yTF=new Array(n).fill(0);
if(mp.doDetrend){var tTr=t.filter(function(_,i){return trainMask[i]}),yTr=y.filter(function(_,i){return trainMask[i]});var ab=fitTrend(tTr,yTr);yTF=t.map(function(ti){return ab[0]+ab[1]*ti});yW=y.map(function(yi,i){return yi-yTF[i]});for(var jj=0;jj<p;jj++){var xTr=X[jj].filter(function(_,i){return trainMask[i]});var axbx=fitTrend(tTr,xTr);XW[jj]=X[jj].map(function(xi,i){return xi-(axbx[0]+axbx[1]*t[i])})}}
var trI=[],teI=[];for(var i=0;i<n;i++){if(trainMask[i])trI.push(i);else teI.push(i)}
var XTM=trI.map(function(i){var row=[1];for(var j=0;j<p;j++)row.push(XW[j][i]);return row});var yTV=trI.map(function(i){return yW[i]});var beta=olsFit(XTM,yTV);
// Compute detrended predictions (on anomaly scale) and raw predictions (trend added back)
var yhatDetr=new Array(n),yhatRaw=new Array(n);for(var i=0;i<n;i++){var v=beta[0];for(var j=0;j<p;j++)v+=beta[j+1]*XW[j][i];yhatDetr[i]=v;yhatRaw[i]=v+yTF[i]}
// When detrending: display & evaluate on anomaly scale; otherwise raw scale
var yDisp=mp.doDetrend?yW:y,yhat=mp.doDetrend?yhatDetr:yhatRaw;
var yTrO=trI.map(function(i){return yDisp[i]}),yTeO=teI.map(function(i){return yDisp[i]}),yhTr=trI.map(function(i){return yhat[i]}),yhTe=teI.map(function(i){return yhat[i]});
var r2Tr=r2score(yTrO,yhTr),r2Te=r2score(yTeO,yhTe),rTr=corrcoef(yTrO,yhTr),rTe=corrcoef(yTeO,yhTe);
var rmseTr=rmse(yTrO,yhTr),rmseTe=rmse(yTeO,yhTe);
// Predictor correlations always on raw data (Step 2 display)
var predCorrs=X.map(function(col){return corrcoef(col,y)});
var adjR2=1-(1-r2Tr)*(nTrain-1)/Math.max(1,nTrain-p-1);
var mTr=yTrO.reduce(function(a,b){return a+b},0)/yTrO.length;var rmseMean=rmse(yTeO,yTeO.map(function(){return mTr}));
return{years:years,t:t,y:y,yDisp:yDisp,X:X,XW:XW,yhat:yhat,yTrend:yTF,trainMask:trainMask,trI:trI,teI:teI,yTrO:yTrO,yTeO:yTeO,yhTr:yhTr,yhTe:yhTe,r2Tr:r2Tr,r2Te:r2Te,adjR2:adjR2,rTr:rTr,rTe:rTe,rmseTr:rmseTr,rmseTe:rmseTe,rmseMean:rmseMean,predCorrs:predCorrs,beta:beta,p:p,nTrain:nTrain,doDetrend:mp.doDetrend}}

function buildEnsemble(baseSeed,params,mp,nRuns){var results=[];for(var i=0;i<nRuns;i++){var r=fitAndScore(baseSeed+i*7+1,params,mp);results.push({r2Tr:r.r2Tr,r2Te:r.r2Te})}return results}

function pVsSkillCurve(baseSeed,params,mp,maxP,nRuns){var pts=[];for(var pp=1;pp<=maxP;pp++){var sumTr=0,sumTe=0;for(var i=0;i<nRuns;i++){var r=fitAndScore(baseSeed+i*7+1,Object.assign({},params,{nPredictors:pp}),mp);sumTr+=r.r2Tr;sumTe+=r.r2Te}pts.push({p:pp,r2Tr:Math.max(-2,Math.min(1,sumTr/nRuns)),r2Te:Math.max(-2,Math.min(1,sumTe/nRuns))})}return pts}

// ============================================================
// SCENARIOS
// ============================================================
var SCENARIOS={
  "Do it yourself":{
    desc:"Explore freely. Adjust all parameters and discover what causes overfitting.",
    params:{startYear:1985,nYears:40,phiY:0.5,sigmaY:0.8,trendY:0,nPredictors:12,phiX:0,sigmaX:1,trendX:0},
    model:{nTrain:25,splitMethod:"Blocked",doDetrend:false},
    guided:false
  },
  "Overfitting":{
    desc:"What happens when you fit many predictors to a short time series, even though none are real?",
    params:{startYear:1985,nYears:40,phiY:0.5,sigmaY:0.8,trendY:0,nPredictors:12,phiX:0,sigmaX:1,trendX:0},
    model:{nTrain:25,splitMethod:"Blocked",doDetrend:false},
    guided:true,
    annotations:{
      step1:"This is your response variable \u2014 think of it as an annual fish catch or coral cover index. It has moderate persistence (\u03D5 = 0.5), meaning each year is partly influenced by the previous one. There is no trend and no relationship to any predictor.",
      step2:"We\u2019ve generated 12 random predictors that have absolutely no connection to y. But look at the bar chart: some predictors will appear to correlate with y by pure chance. With 12 predictors, you\u2019d typically expect about 1 to exceed the significance threshold even though the relationship is entirely spurious.",
      step3:"The model fits the training data well (R\u00B2 \u2248 0.4\u20130.8) because with 12 free parameters and only 25 data points, it can \u2018memorise\u2019 much of the noise. But look at the test R\u00B2 \u2014 it\u2019s typically negative, meaning the model\u2019s predictions are worse than simply guessing the mean. This is overfitting: apparent skill that doesn\u2019t generalise.",
      step4:"Across 100 different realisations (same properties, different random numbers), training R\u00B2 is consistently positive while test R\u00B2 clusters around zero or below. This isn\u2019t bad luck \u2014 it\u2019s a systematic consequence of fitting too many parameters to too little data. The R\u00B2-vs-p curve shows this directly: as you add predictors, training skill rises but test skill degrades."
    }
  },
  "Leakage":{
    desc:"How does the choice of validation strategy affect apparent skill when y is autocorrelated?",
    params:{startYear:1920,nYears:100,phiY:0.95,sigmaY:0.8,trendY:0,nPredictors:10,phiX:0.95,sigmaX:1,trendX:0},
    model:{nTrain:65,splitMethod:"Random",doDetrend:false},
    guided:true,
    annotations:{
      step1:"This time y has very strong persistence (\u03D5 = 0.95). Adjacent years have very similar values \u2014 the series has long \u2018memory.\u2019 This is typical of ocean temperatures, ice extent, and many climate indices. Notice how smooth the time series looks.",
      step2:"The 10 predictors are also strongly autocorrelated (\u03D5 = 0.95) but completely independent of y. Any correlations you see are spurious. Notice how smooth the predictor time series look \u2014 this smoothness is what enables the leakage problem.",
      step3:"We\u2019re using a Random validation split. Because both y and the predictors are very smooth (high autocorrelation), randomly scattered test years sit right next to training years with nearly identical values. The model exploits this overlap: it effectively \u2018interpolates\u2019 between nearby training points. The test R\u00B2 is typically positive (~0.5) \u2014 but this is an illusion. Now switch to Blocked split and watch the test R\u00B2 collapse to strongly negative. Blocked splits separate training and test periods in time, preventing this leakage.",
      step4:"The ensemble confirms the pattern systematically. Re-run with Random splits \u2014 test R\u00B2 clusters around +0.5. Switch to Blocked and re-run \u2014 test R\u00B2 is overwhelmingly negative. The lesson: always use blocked (contiguous) train/test splits for autocorrelated time series. Random splits inflate apparent skill by leaking temporal information."
    }
  },
  "Shared trend":{
    desc:"What happens when both y and predictors share a common trend?",
    params:{startYear:1940,nYears:80,phiY:0.3,sigmaY:0.5,trendY:0.15,nPredictors:3,phiX:0.3,sigmaX:0.5,trendX:0.15},
    model:{nTrain:52,splitMethod:"Blocked",doDetrend:false},
    guided:true,
    annotations:{
      step1:"Now y has a clear upward trend (0.15 units/year). Think of this as warming SST, declining ice extent, or any variable with a long-term drift. The noise is moderate (\u03C3 = 0.5) with low persistence (\u03D5 = 0.3).",
      step2:"The 3 predictors also share the same upward trend (0.15 units/year). This is realistic \u2014 many environmental variables trend together due to a common driver (e.g. climate change). Look at the correlation bar chart: the predictors appear to correlate with y, but this is entirely because they share the same trend, not because one predicts the other\u2019s interannual variability.",
      step3:"We use a Blocked split \u2014 training is the first 52 years, test is the last 28. Despite this proper validation strategy, the model shows high test R\u00B2 (~0.7). This is because both y and the predictors share the same upward trend: the model learns the trend relationship in training and it extrapolates to the test period. But is this real predictive skill? Toggle the \u2018Detrend\u2019 checkbox: once the shared trend is removed, R\u00B2 collapses to near zero or negative. The model was capturing the common trend, not a genuine predictive relationship.",
      step4:"Run the ensemble with detrending OFF, then toggle detrending ON and re-run. Without detrending, test R\u00B2 clusters around +0.7. With detrending, it collapses to zero or negative. Unlike the leakage scenario (which is fixed by using blocked splits), shared-trend spurious skill persists even with correct validation. The only remedy is detrending. This is perhaps the most common source of spurious relationships in environmental science."
    }
  }
};

// ============================================================
// COLOURS
// ============================================================
var BLUE="#2563eb",RED="#dc2626",GREY="#4b5563",LGREY="#9ca3af",AMBER="#f59e0b",GREEN="#16a34a",PURPLE="#7c3aed";

// ============================================================
// SVG CHART HELPERS
// ============================================================
function niceRange(mn,mx,nTicks){if(mx-mn<1e-9){mn-=1;mx+=1}var rough=(mx-mn)/(nTicks-1);var mag=Math.pow(10,Math.floor(Math.log10(rough)));var residual=rough/mag;var nice;if(residual<=1.5)nice=1;else if(residual<=3)nice=2;else if(residual<=7)nice=5;else nice=10;var step=nice*mag;var lo=Math.floor(mn/step)*step;var hi=Math.ceil(mx/step)*step;var ticks=[];for(var v=lo;v<=hi+step*0.001;v+=step)ticks.push(parseFloat(v.toFixed(10)));return{lo:lo,hi:hi,ticks:ticks}}
function fmtTick(v){return Math.abs(v)>=1000?v.toFixed(0):Math.abs(v)<0.01&&v!==0?v.toExponential(1):parseFloat(v.toFixed(2)).toString()}

function SvgLine(props){
  var W=props.width||600,H=props.height||200,series=props.series,xLbl=props.xLabel,yLbl=props.yLabel,title=props.title,yMin=props.yMin,yMax=props.yMax,refY=props.refLineY,refX=props.refLineX,shade=props.shadeRegions;
  var mg={t:title?28:12,r:16,b:xLbl?38:26,l:48};var w=W-mg.l-mg.r,ht=H-mg.t-mg.b;
  var allX=[],allY=[];series.forEach(function(s){s.data.forEach(function(d){allX.push(d.x);allY.push(d.y)})});
  if(!allX.length)return h("svg",{width:W,height:H});
  var xr=niceRange(Math.min.apply(null,allX),Math.max.apply(null,allX),6);
  var yr;if(yMin!==undefined&&yMax!==undefined)yr=niceRange(yMin,yMax,5);else yr=niceRange(Math.min.apply(null,allY),Math.max.apply(null,allY),5);
  var sx=function(v){return mg.l+((v-xr.lo)/(xr.hi-xr.lo))*w};
  var sy=function(v){return mg.t+ht-((v-yr.lo)/(yr.hi-yr.lo))*ht};
  var clip=function(v){return Math.max(yr.lo,Math.min(yr.hi,v))};
  var els=[];
  if(title)els.push(h("text",{key:"t",x:W/2,y:16,textAnchor:"middle",fontSize:12,fontWeight:600,fill:"#374151"},title));
  yr.ticks.forEach(function(v,i){els.push(h("line",{key:"gy"+i,x1:mg.l,y1:sy(v),x2:mg.l+w,y2:sy(v),stroke:"#f0f0f0"}));els.push(h("text",{key:"gyl"+i,x:mg.l-4,y:sy(v)+3,textAnchor:"end",fontSize:9,fill:"#9ca3af"},fmtTick(v)))});
  xr.ticks.forEach(function(v,i){els.push(h("line",{key:"gx"+i,x1:sx(v),y1:mg.t,x2:sx(v),y2:mg.t+ht,stroke:"#f0f0f0"}));els.push(h("text",{key:"gxl"+i,x:sx(v),y:mg.t+ht+14,textAnchor:"middle",fontSize:9,fill:"#9ca3af"},fmtTick(v)))});
  if(shade)shade.forEach(function(sr,i){var x1c=Math.max(mg.l,sx(sr.x1)),x2c=Math.min(mg.l+w,sx(sr.x2));if(x2c>x1c)els.push(h("rect",{key:"sr"+i,x:x1c,y:mg.t,width:x2c-x1c,height:ht,fill:sr.color,opacity:sr.opacity||0.08}))});
  if(refY!==undefined)els.push(h("line",{key:"rly",x1:mg.l,y1:sy(refY),x2:mg.l+w,y2:sy(refY),stroke:"#d1d5db",strokeDasharray:"4,4"}));
  if(refX!==undefined)els.push(h("line",{key:"rlx",x1:sx(refX),y1:mg.t,x2:sx(refX),y2:mg.t+ht,stroke:AMBER,strokeDasharray:"4,4"}));
  els.push(h("rect",{key:"border",x:mg.l,y:mg.t,width:w,height:ht,fill:"none",stroke:"#e5e7eb"}));
  series.forEach(function(s,si){var pts=s.data.map(function(d){return{x:sx(d.x),y:sy(clip(d.y))}});if(!s.noline){var path=pts.map(function(p,i){return(i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)}).join("");els.push(h("path",{key:"l"+si,d:path,fill:"none",stroke:s.color||GREY,strokeWidth:s.width||2,strokeDasharray:s.dash||"none"}))}if(s.dots)pts.forEach(function(p,i){var dc=typeof s.dotColor==="function"?s.dotColor(i):s.dotColor||s.color||GREY;els.push(h("circle",{key:"d"+si+"_"+i,cx:p.x,cy:p.y,r:s.dotR||3,fill:dc,stroke:"#fff",strokeWidth:0.8}))})});
  if(xLbl)els.push(h("text",{key:"xl",x:mg.l+w/2,y:H-4,textAnchor:"middle",fontSize:10,fill:"#6b7280"},xLbl));
  if(yLbl)els.push(h("text",{key:"yl",x:14,y:mg.t+ht/2,textAnchor:"middle",fontSize:10,fill:"#6b7280",transform:"rotate(-90,14,"+(mg.t+ht/2)+")"},yLbl));
  var legendItems=series.filter(function(s){return s.label});
  if(legendItems.length>0){var lx=mg.l+8,ly=mg.t+8;legendItems.forEach(function(s,i){var y0=ly+i*16;els.push(h("line",{key:"ll"+i,x1:lx,y1:y0,x2:lx+16,y2:y0,stroke:s.color,strokeWidth:2,strokeDasharray:s.dash||"none"}));els.push(h("text",{key:"lt"+i,x:lx+20,y:y0+4,fontSize:10,fill:"#4b5563"},s.label))})}
  return h("svg",{width:W,height:H,style:{background:"#fff",borderRadius:6,display:"block",maxWidth:"100%"}},els);
}

function SvgBar(props){
  var W=props.width||500,H=props.height||160,bars=props.bars,threshold=props.threshold;
  var mg={t:8,r:12,b:30,l:36};var w=W-mg.l-mg.r,ht=H-mg.t-mg.b;var n=bars.length;
  if(!n)return h("svg",{width:W,height:H});
  var barW=Math.max(2,Math.min(24,(w-n*2)/n));var gap=(w-n*barW)/(n+1);
  var yr=niceRange(-1,1,5);var sy=function(v){return mg.t+ht-((v-yr.lo)/(yr.hi-yr.lo))*ht};var y0=sy(0);
  var els=[];
  yr.ticks.forEach(function(v,i){els.push(h("line",{key:"g"+i,x1:mg.l,y1:sy(v),x2:mg.l+w,y2:sy(v),stroke:"#f0f0f0"}));els.push(h("text",{key:"gl"+i,x:mg.l-4,y:sy(v)+3,textAnchor:"end",fontSize:9,fill:"#9ca3af"},v.toFixed(1)))});

          h("button",{style:{fontSize:12,color:BLUE,border:"none",background:"none",padding:"4px 0",marginTop:4},onClick:function(){setShowAdv(!showAdv)}},(showAdv?"Hide":"Show")+" advanced controls"),

      !isGuided&&!stepsActive.s2&&h("div",{style:{textAlign:"right",marginTop:8}},

            h("button",{style:btnS("primary"),onClick:newRealisation},"New random realisation"))),
        h("div",{style:{flex:1,minWidth:300}},
          h("div",{style:{fontSize:12,fontWeight:600,color:"#4b5563",marginBottom:4}},"Predictor time series (highlighted: P"+(hiIdx+1)+")"),
          h(SvgLine,{width:600,height:170,series:predTS,xLabel:"Year",yLabel:"X"}),
          h("div",{style:{fontSize:12,fontWeight:600,color:"#4b5563",marginTop:12,marginBottom:4}},
            "Predictor\u2013y correlations (amber bars exceed the 2/\u221An significance threshold)"),

          h("p",{style:{fontSize:12,color:"#6b7280",marginTop:4}},
            "Strongest |r| = "+maxAbsR.toFixed(2)+". "+nAbove+" of "+params.nPredictors+" predictors exceed the threshold by chance alone. With "+params.nPredictors+" predictors, you\u2019d expect roughly "+Math.max(1,Math.round(params.nPredictors*0.05))+" false positive"+(Math.round(params.nPredictors*0.05)!==1?"s":"")+" at the 5% level even with no real relationships."))),
      !isGuided&&!stepsActive.s3&&h("div",{style:{textAlign:"right",marginTop:8}},
        h("button",{style:btnS("primary"),onClick:function(){advanceStep(2)}},"Next: Fit model \u2192"))),

    // ========== STEP 3 ==========
    h(StepBox,{active:stepsActive.s3,open:stepsOpen.s3,onToggle:function(){toggleStep("s3")},color:GREEN,title:"Step 3 \u2014 Fit an OLS multiple regression and evaluate"},
      annotations.step3&&h(Callout,{color:"dark",title:"\uD83D\uDC41\uFE0F What to notice"},annotations.step3),
      h("div",{style:{display:"flex",gap:20,flexWrap:"wrap",marginBottom:16}},
        h("div",{style:{minWidth:280,maxWidth:360}},
          h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px 16px"}},
            h(Ctrl,{label:"Training years (test: "+(params.nYears-nTrain)+")",value:nTrain,onChange:function(v){setNTrain(v);setEnsemble([]);setPCurve([])},min:5,max:maxTrainSlider,step:1,tip:"How many years to use for fitting. The rest are reserved for independent testing."}),
            h("div",null,

            h("div",{style:hCard(BLUE)},
              h("div",{style:{fontSize:28,fontWeight:700,color:BLUE,lineHeight:1.2}},isNaN(run.r2Tr)?"\u2014":run.r2Tr.toFixed(2)),

            h("div",{style:hCard(RED)},
              h("div",{style:{fontSize:28,fontWeight:700,color:RED,lineHeight:1.2}},isNaN(run.r2Te)?"\u2014":run.r2Te.toFixed(2)),
              h("div",{style:{fontSize:11,color:"#6b7280",marginTop:2}},doDetrend?"R\u00B2 Test (detrended)":"R\u00B2 Test (out-of-sample)"))),

            h("p",{style:{marginTop:12,color:"#6b7280",lineHeight:1.5}},"Each dot is one independent dataset. The diagonal dashed line marks where train = test skill. Points below the red dashed line (R\u00B2 = 0) indicate the model is worse than the mean."),
